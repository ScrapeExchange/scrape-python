# Prometheus alerting rules for the YouTube scraper fleet.
#
# Load from prometheus.yml via:
#   rule_files:
#     - /etc/prometheus/rules/prometheus-alerts-youtube.yml
#
# Thresholds are tuned for the current production layout:
#   video:   num_processes=6, concurrency=12  (72 async tasks)
#   rss:     num_processes=4, concurrency=20  (80 async tasks)
#   channel: num_processes=4, concurrency=14  (56 async tasks)
#   proxies: 58
# Re-tune if you scale the fleet significantly.
#
# All alerts route through the existing Alertmanager receivers via
# the `severity` label. `scraper` label is preserved so dashboards
# and notifications can group by tool.

groups:

  - name: youtube_scraper_failures
    interval: 30s
    rules:

      # --- VIDEO -----------------------------------------------------

      - alert: YtVideoSuccessFractionLow
        expr: |
          sum(rate(yt_video_proxy_videos_scraped_total[15m]))
          /
          (
            sum(rate(yt_video_proxy_videos_scraped_total[15m]))
            +
            sum(rate(yt_video_proxy_scrape_failures_total[15m]))
          ) < 0.60
        for: 15m
        labels:
          severity: warning
          scraper: video
        annotations:
          summary: "Video scraper success fraction below 60%"
          description: |
            Only {{ $value | humanizePercentage }} of video scrape
            attempts are succeeding over the last 15m. Check the
            failure breakdown panel and consider scaling
            video_num_processes *down* if rate_limit is dominant.

      - alert: YtVideoSuccessFractionCritical
        expr: |
          sum(rate(yt_video_proxy_videos_scraped_total[15m]))
          /
          (
            sum(rate(yt_video_proxy_videos_scraped_total[15m]))
            +
            sum(rate(yt_video_proxy_scrape_failures_total[15m]))
          ) < 0.30
        for: 15m
        labels:
          severity: critical
          scraper: video
        annotations:
          summary: "Video scraper success fraction below 30%"
          description: |
            Video scraper is failing {{ $value | humanizePercentage }}
            of attempts. Strong signal of YouTube blocking or proxy
            pool exhaustion.

      - alert: YtVideoRateLimitFailuresHigh
        expr: |
          sum(rate(yt_video_proxy_scrape_failures_total{
            reason="rate_limit"
          }[10m])) > 0.10
        for: 10m
        labels:
          severity: warning
          scraper: video
        annotations:
          summary: "Video scraper sustained rate_limit failures"
          description: |
            {{ $value | humanize }} rate_limit failures/s sustained
            for 10m. Per-IP ceiling likely hit; scale
            video_num_processes down rather than up.

      - alert: YtVideoRateLimiterHitsHigh
        expr: |
          sum(rate(yt_video_proxy_rate_limit_hits_total[10m])) > 0.50
        for: 10m
        labels:
          severity: warning
          scraper: video
        annotations:
          summary: "Video rate limiter acquiring slowly"
          description: |
            {{ $value | humanize }} rate-limit hits/s over 10m —
            workers are spending significant time waiting on the
            token bucket.

      - alert: YtVideoThroughputCollapsed
        expr: |
          sum(rate(yt_video_proxy_videos_scraped_total[15m])) < 0.05
          and
          sum(yt_video_proxy_queue_size) > 1000
        for: 15m
        labels:
          severity: critical
          scraper: video
        annotations:
          summary: "Video scraper throughput near zero with backlog"
          description: |
            Scrape rate is {{ $value | humanize }} videos/s while
            the queue still has pending work. Workers are stuck
            (rate limiter, backoff, or upstream block).

      # --- RSS -------------------------------------------------------

      - alert: YtRssFeedFailureRateHigh
        expr: |
          sum(rate(yt_rss_feed_download_failures_total[15m]))
          /
          (
            sum(rate(yt_rss_feeds_downloaded_total[15m]))
            +
            sum(rate(yt_rss_feed_download_failures_total[15m]))
          ) > 0.20
        for: 15m
        labels:
          severity: warning
          scraper: rss
        annotations:
          summary: "RSS feed download failure rate above 20%"
          description: |
            {{ $value | humanizePercentage }} of RSS feed fetches
            are failing over the last 15m.

      - alert: YtRssFeedFailureRateCritical
        expr: |
          sum(rate(yt_rss_feed_download_failures_total[15m]))
          /
          (
            sum(rate(yt_rss_feeds_downloaded_total[15m]))
            +
            sum(rate(yt_rss_feed_download_failures_total[15m]))
          ) > 0.50
        for: 15m
        labels:
          severity: critical
          scraper: rss
        annotations:
          summary: "RSS feed download failure rate above 50%"
          description: |
            {{ $value | humanizePercentage }} of RSS feed fetches
            are failing. YouTube likely blocking or proxies broken.

      - alert: YtRssInnertubeFailuresHigh
        expr: |
          sum(rate(yt_rss_innertube_call_failures_total[10m])) > 0.20
        for: 10m
        labels:
          severity: warning
          scraper: rss
        annotations:
          summary: "RSS innertube call failures sustained"
          description: |
            {{ $value | humanize }} innertube failures/s over 10m —
            often the first signal of YouTube bot detection on
            the RSS path.

      # --- CHANNEL ---------------------------------------------------

      # no_content_found is subtracted because it's a legitimate
      # "this channel has no uploads" outcome, not a failure.
      - alert: YtChannelRealFailureRateHigh
        expr: |
          (
            sum(rate(yt_channel_scrape_failures_total[15m]))
            -
            sum(rate(yt_channel_no_content_found_total[15m]))
          )
          /
          sum(rate(yt_channel_scraped_total[15m])) > 0.20
        for: 15m
        labels:
          severity: warning
          scraper: channel
        annotations:
          summary: "Channel scraper real failure rate above 20%"
          description: |
            {{ $value | humanizePercentage }} of channel scrapes
            are failing for reasons other than empty channels.

      - alert: YtChannelIdResolutionFailing
        expr: |
          sum(rate(yt_channel_id_resolution_failures_total[15m]))
          /
          (
            sum(rate(yt_channel_ids_resolved_total[15m]))
            +
            sum(rate(yt_channel_id_resolution_failures_total[15m]))
          ) > 0.30
        for: 15m
        labels:
          severity: warning
          scraper: channel
        annotations:
          summary: "Channel ID resolution failing above 30%"
          description: |
            {{ $value | humanizePercentage }} of channel handle →
            ID lookups are failing. Upstream or innertube issue.

      - alert: YtChannelQueueMemberInMultipleStates
        expr: |
          channel_queue_drift_size{kind="member_in_multiple_states"} > 0
        for: 10m
        labels:
          severity: warning
          scraper: channel
        annotations:
          summary: "Channel queue member exists in multiple states"
          description: |
            {{ $value | humanize }} channel queue members are present
            in more than one active or terminal state. Inspect with
            yt_channel_queue reconcile --dry-run --json --sample 25.

      - alert: YtChannelQueueRssCreatorsMissingChannelState
        expr: |
          channel_queue_drift_size{
            kind="rss_creator_missing_channel_state"
          } > 1000
        for: 30m
        labels:
          severity: warning
          scraper: channel
        annotations:
          summary: "RSS creators missing channel scrape accounting"
          description: |
            More than 1000 RSS creators are absent from channel queue
            active and terminal state. Run bounded rss-missing repair.

      - alert: YtChannelQueueStateMissingRssAccounting
        expr: |
          channel_queue_drift_size{
            kind="channel_state_missing_rss_accounting"
          } > 1000
        for: 30m
        labels:
          severity: warning
          scraper: channel
        annotations:
          summary: "Channel queue state missing RSS accounting"
          description: |
            More than 1000 channel queue members are missing both RSS
            active inventory and RSS suppression accounting.

      - alert: YtChannelTerminalMissingRssSuppression
        expr: |
          channel_queue_drift_size{
            kind="channel_terminal_missing_rss_suppression"
          } > 0
        for: 30m
        labels:
          severity: warning
          scraper: channel
        annotations:
          summary: "Terminal channel state missing RSS suppression"
          description: |
            Confirmed terminal channel states should be reflected in
            rss:youtube:suppressed. Run rss-suppress repair.

      - alert: YtChannelMetaScheduledMissingZset
        expr: |
          channel_queue_drift_size{
            kind="meta_scheduled_missing_zset"
          } > 1000
        for: 30m
        labels:
          severity: warning
          scraper: channel
        annotations:
          summary: "Scheduled channel metadata missing queue entry"
          description: |
            More than 1000 channel meta records say scheduled but are
            absent from every scheduled queue tier.

      - alert: YtChannelQueueReconcileStale
        expr: |
          time() - channel_queue_reconcile_last_success_timestamp > 21600
        for: 10m
        labels:
          severity: warning
          scraper: channel
        annotations:
          summary: "Channel queue reconcile metrics are stale"
          description: |
            No successful channel/RSS queue reconcile metrics pass has
            completed in more than 6 hours.

      # --- FLEET-WIDE ------------------------------------------------

      # Supervisors do not export scrape-able metrics; the worker
      # series are what Prometheus actually sees, so alert when no
      # worker of a scraper type reports anywhere in the fleet.
      - alert: YtScraperWorkersMissing
        expr: |
          absent(scraper_num_processes{role="worker",scraper="video"})
          or
          absent(scraper_num_processes{role="worker",scraper="rss"})
          or
          absent(scraper_num_processes{role="worker",scraper="channel"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No workers reporting for a YouTube scraper"
          description: |
            No worker metrics seen anywhere in the fleet for at least
            one scraper (video, rss, or channel) in the last 5m. All
            its processes died or every Prometheus scrape target for
            it is unreachable.

  # --- SEARCH DISCOVERY (yt_discover_search.py) ----------------------
  #
  # Evidence that YouTube is rate limiting or blocking InnerTube
  # searches. Metrics come from the youtube_discover_search job
  # (port 9550); searches use the YOUTUBE_SEARCH_PER_MIN bucket.

  - name: youtube_discover_search
    interval: 30s
    rules:

      - alert: YtSearchRateLimited
        expr: |
          sum(rate(discover_search_http_errors_total{status="429"}[10m]))
          > 0
        for: 10m
        labels:
          severity: warning
          scraper: discover
        annotations:
          summary: "YouTube is answering searches with HTTP 429"
          description: |
            {{ $value | humanize }} search requests/s rejected with
            HTTP 429 for 10m. YouTube is rate limiting searches; lower
            YOUTUBE_SEARCH_PER_MIN or YOUTUBE_SEARCH_CONCURRENCY.

      - alert: YtSearchRateLimitedCritical
        expr: |
          sum(rate(discover_search_http_errors_total{status="429"}[10m]))
          /
          (
            sum(rate(discover_search_pages_total{outcome="success"}[10m]))
            +
            sum(rate(discover_search_errors_total[10m]))
          ) > 0.05
        for: 10m
        labels:
          severity: critical
          scraper: discover
        annotations:
          summary: "Over 5% of searches rejected with HTTP 429"
          description: |
            {{ $value | humanizePercentage }} of search attempts got
            HTTP 429 over 10m. Sustained 429s risk longer blocks of
            the proxies' IPs for all YouTube scrapers; reduce
            YOUTUBE_SEARCH_PER_MIN now.

      - alert: YtSearchForbidden
        expr: |
          sum(rate(discover_search_http_errors_total{status="403"}[15m]))
          > 0.01
        for: 15m
        labels:
          severity: warning
          scraper: discover
        annotations:
          summary: "YouTube is answering searches with HTTP 403"
          description: |
            {{ $value | humanize }} search requests/s rejected with
            HTTP 403 for 15m: a block of the requesting IPs or
            client. Check the proxy health panels for the affected
            proxies.

      - alert: YtSearchBotCheckResponses
        expr: |
          sum(rate(discover_search_errors_total{
            error_type="ResponseError"
          }[15m])) > 0.01
        for: 15m
        labels:
          severity: warning
          scraper: discover
        annotations:
          summary: "Search responses are not JSON (bot check / interstitial)"
          description: |
            {{ $value | humanize }} search responses/s were not
            InnerTube JSON for 15m, typically a consent or bot-check
            interstitial page. YouTube is challenging the search
            client; reduce the search rate.

      - alert: YtSearchPageFailureRatioHigh
        expr: |
          sum(rate(discover_search_pages_total{outcome="failed"}[20m]))
          /
          sum(rate(discover_search_pages_total[20m])) > 0.20
        for: 20m
        labels:
          severity: warning
          scraper: discover
        annotations:
          summary: "Over 20% of search pages fail after retries"
          description: |
            {{ $value | humanizePercentage }} of search pages failed
            after retries over 20m. Check "Search errors /s by type":
            RequestError/ResponseError point at YouTube throttling,
            transport errors at proxies.

      - alert: YtSearchLatencyDegraded
        expr: |
          histogram_quantile(0.95, sum by (le) (
            rate(discover_search_duration_seconds_bucket[15m])
          )) > 15
        for: 30m
        labels:
          severity: warning
          scraper: discover
        annotations:
          summary: "Search p95 latency above 15s"
          description: |
            InnerTube search p95 is {{ $value | humanize }}s (rate
            limiter wait excluded) for 30m. Slow responses can be
            YouTube throttling before outright 429s, or slow proxies.
