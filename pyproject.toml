[project]
name = "scrape-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "brotli>=1.2.0",
    "country-converter>=1.3.2",
    "httpx[http2,socks]>=0.23.3",
    "innertube>=2.1.19",
    "jsonschema>=4.26.0",
    "orjson>=3.11.7",
    "pydantic-settings>=2.3.0",
    "untangle>=1.2.1",
    "websockets>=16.0",
    "yt-dlp[curl-cffi,default]>=2026.3.3",
    "yt-dlp-ejs>=0.5.0",
    "httpx-curl-cffi>=0.1.5",
    "prometheus-client>=0.21.0",
    "redis[hiredis]>=5.0.0",
    "watchfiles>=1.1.1",
    "beautifulsoup4>=4.14.3",
    "kagglehub>=1.0.1",
    "huggingface-hub>=0.26.0",
    "pyarrow>=24.0.0",
    "paramiko>=3.5.0",
    # Pins are coupled and load-bearing (see the camoufox
    # anti-detection design spec): Camoufox's Firefox 135 build
    # crashes on Playwright 1.60, and the CamoufoxTikTokApi subclass
    # depends on TikTokApi 7.1.0 internals. Do not float these.
    "tiktokapi==7.1.0",
    "playwright==1.51.0",
    "camoufox[geoip]>=0.4.0",
]

[project.scripts]
scrape-queue = "tools.scrape_queue:main"
tt-video-scrape = "tools.tt_video_scrape:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["scrape_exchange*", "tools*"]

[dependency-groups]
dev = [
    "coverage>=7.13.4",
    "fakeredis[lua]>=2.0",
]
