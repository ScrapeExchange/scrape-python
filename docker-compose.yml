# Base docker-compose configuration for scrape-python scrapers.
#
# Usage with a per-host override:
#   docker compose -f docker-compose.yml \
#     -f docker-compose.<your-host>.yml up -d
#
# All services use the ghcr.io image. Host-specific settings belong in
# .env, and host bind mounts belong in the override file.

x-scraper-common: &scraper-common
  image: ghcr.io/scrapeexchange/scrape-python:latest
  env_file: .env
  restart: unless-stopped
  network_mode: host
  stop_grace_period: 60s

services:
  po-token-provider:
    image: brainicism/bgutil-ytdlp-pot-provider
    restart: unless-stopped
    network_mode: host
    init: true

  yt-video:
    <<: *scraper-common
    command: ["tools/yt_video_scrape.py"]
    depends_on:
      - po-token-provider
    container_name: yt-video

  yt-channel:
    <<: *scraper-common
    command: ["tools/yt_channel_scrape.py"]
    container_name: yt-channel

  yt-rss:
    <<: *scraper-common
    command: ["tools/yt_rss_scrape.py"]
    container_name: yt-rss

  tt-creator:
    <<: *scraper-common
    command: ["tools/tt_creator_scrape.py"]
    container_name: tt-creator

  tt-video:
    <<: *scraper-common
    command: ["tools/tt_video_scrape.py"]
    container_name: tt-video

  ig-creator:
    <<: *scraper-common
    command: ["tools/ig_creator_scrape.py"]
    container_name: ig-creator

  scrape-upload:
    <<: *scraper-common
    command: ["tools/scrape_upload.py"]
    container_name: scrape-upload
    profiles:
      - scrape-upload
