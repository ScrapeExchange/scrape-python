# Base docker-compose configuration for scrape-python scrapers.
#
# Usage with a per-host override:
#   docker compose -f docker-compose.yml \
#     -f docker-compose.<your-host>.yml up -d
#
# All services use the ghcr.io image. Host-specific settings belong in
# .env, and host bind mounts belong in the override file.

x-scraper-common: &scraper-common
  image: ghcr.io/scrapeexchange/scrape-python:latest
  env_file: .env
  environment:
    # Cap glibc malloc arenas. Scrapers run many worker threads
    # (thread-pool extract_info, to_thread I/O); each thread otherwise
    # gets its own 64 MB arena that keeps freed memory, which held
    # ~1.7 GB per yt-video worker. Override in .env if needed.
    MALLOC_ARENA_MAX: ${MALLOC_ARENA_MAX:-2}
    # Keep proxy environment OUT of the scrapers. Egress is decided
    # only by the scrapers' own per-request proxy selection
    # (PROXY_FILES + proxy= on each client). The clients that still
    # honour the environment (the bare httpx clients used for
    # exchange existence checks and discovery, plus curl_cffi for
    # proxyless YouTube fetches) would otherwise send LAN and
    # scrape.exchange calls through a VPN squid, and NO_PROXY cannot
    # be spelled portably: httpx 0.23.3 silently ignores CIDR
    # entries and a leading-dot suffix does not match the apex.
    # Explicitly empty values stop docker from injecting the
    # daemon/CLI proxy configuration into these containers; both
    # cases are set because urllib reads both and libcurl reads the
    # lowercase form for http_proxy.
    HTTP_PROXY: ""
    HTTPS_PROXY: ""
    NO_PROXY: ""
    http_proxy: ""
    https_proxy: ""
    no_proxy: ""
  restart: unless-stopped
  network_mode: host
  stop_grace_period: 60s
  # Scrapers hold one socket per proxy tunnel plus their queue
  # connections: yt-channel measured ~2,600 proxy sockets and ~40 to
  # backlog-server per worker, against Docker's default soft limit of
  # 1024. The hard limit is already 524288, so the default soft limit is
  # the only thing capping them.
  ulimits:
    nofile:
      soft: 65536
      hard: 65536

services:
  po-token-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2
    restart: unless-stopped
    network_mode: host
    init: true

  # Backlog server for the YouTube and TikTok video queues (declared in
  # BACKLOG_QUEUES, see TIKTOK.md for TikTok). Runs on one host only:
  # enable it there with `--profile backlog` (or COMPOSE_PROFILES).
  # Set BACKLOG_DATA_DIR_HOST, BACKLOG_PASSWORD, BACKLOG_LISTEN and
  # BACKLOG_METRICS_LISTEN in .env; see
  # docs/operator/2026-10-20-backlog-server-cutover.md.
  backlog-server:
    image: ghcr.io/scrapeexchange/backlog-server:latest
    build: ./backlog-server
    profiles: ["backlog"]
    container_name: backlog-server
    env_file: .env
    environment:
      BACKLOG_DATA_DIR: /data
    user: "1002:1002"
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 20g
    # The queue server holds one descriptor per client connection and
    # one per open data file; at Docker's default soft limit of 1024 the
    # kernel runs out before BACKLOG_MAX_CONNECTIONS refuses anything,
    # and `accept()` starts failing with EMFILE while the process looks
    # healthy. Keep this comfortably above BACKLOG_MAX_CONNECTIONS.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - type: bind
        source: ${BACKLOG_DATA_DIR_HOST:-/path/to/backlog}
        target: /data
        bind:
          create_host_path: false

