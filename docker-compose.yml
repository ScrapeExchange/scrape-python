# Base docker-compose configuration for scrape-python scrapers.
#
# Usage with a per-host override:
#   docker compose -f docker-compose.yml \
#     -f docker-compose.<your-host>.yml up -d
#
# All services use the ghcr.io image. Host-specific settings belong in
# .env, and host bind mounts belong in the override file.

x-scraper-common: &scraper-common
  image: ghcr.io/scrapeexchange/scrape-python:latest
  env_file: .env
  restart: unless-stopped
  network_mode: host
  stop_grace_period: 60s

services:
  po-token-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2
    restart: unless-stopped
    network_mode: host
    init: true

# Uncomment the redis section to run a Redis server on your host
#  redis:
#    container_name: "redis"
#    image: "redis:latest"
#    ports:
#      - 6379:6379/tcp
#    restart: "unless-stopped"
#    volumes:
#      - type: bind
#        source: /var/tmp/scrape-redis
#        target: /data
#        bind:
#          create_host_path: true
#    environment: []
#    command:
#      - "redis-server"
#      - "--appendonly"
#      - "yes"
#      - "--requirepass"
#      - "<changeme>"                     # set in .env, not committed
#      - "--rename-command"
