#      - --redis.addr=redis://:topsecret@redis:6379

  yt-video:
    <<: *scraper-common
    command: ["tools/yt_video_scrape.py"]
    depends_on:
      - po-token-provider
    container_name: yt-video

  yt-channel:
    <<: *scraper-common
    command: ["tools/yt_channel_scrape.py"]
    container_name: yt-channel

  yt-rss:
    <<: *scraper-common
    command: ["tools/yt_rss_scrape.py"]
    container_name: yt-rss

  yt-discover-search:
    <<: *scraper-common
    profiles: ["discovery"]
    container_name: yt-discover-search
    init: true
    command:
      - tools/yt_discover_search.py
      - --pid-file
      - /run/discovery/yt_discover_search.pid
      - --log-file
      - /var/log/scrape/yt_discover_search.log
      - --youtube-search-concurrency
      - "2"
      # Market x term popularity-scoped pass: sorts search results by
      # view count per country to enumerate the highest-subscriber
      # channels (the retired trending feed's replacement).
      - --discover-markets
      - >-
        IN:hi,US:en,BR:pt,ID:id,MX:es,RU:ru,TR:tr,EG:ar,SA:ar,KR:ko,
        JP:ja,PH:fil,VN:vi,TH:th,PK:ur,BD:bn,NG:en,DE:de,GB:en,FR:fr,
        IT:it,ES:es,AR:es,CO:es,PL:pl,UA:uk,DZ:ar,MA:ar,IQ:ar,TW:zh-TW
      - --discover-popular-continuations
      - "5"
      - --discover-source
      - discovered_popular

    # Clear the PID file on restart; container PIDs can be reused.
    tmpfs:
      - /run/discovery
    volumes:
      - type: bind
        source: ${HOME}/proxies
        target: /data/proxies
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data
        target: /data/discovery
        bind:
          create_host_path: false

  tt-creator:
    <<: *scraper-common
    command: ["tools/tt_creator_scrape.py"]
    container_name: tt-creator
    # Reaps the Firefox processes orphaned each time a session browser
    # is closed; without it they pile up as zombies under PID 1.
    init: true
    # Camoufox browsers measured at ~700 MiB PSS each after bootstrap,
    # growing to ~1.5 GiB within an hour (TIKTOK_BROWSER_MAX_AGE
    # recycles them); 8g OOM-killed renderers.
    mem_limit: 16g
    # Firefox content processes abort with "Page crashed" when /dev/shm
    # is the Docker default of 64m; 512m matches the browser's appetite.
    shm_size: 512m

  tt-video:
    <<: *scraper-common
    command: ["tools/tt_video_scrape.py"]
    container_name: tt-video
    init: true
    # Camoufox browsers at ~700 MiB each after bootstrap, growing to
    # ~1.5 GiB (see tt-creator). The limit keeps an OOM inside this
    # container instead of starving the host.
    mem_limit: 8g
    # Firefox content processes abort with "Page crashed" when /dev/shm
    # is the Docker default of 64m; 512m matches the browser's appetite.
    shm_size: 512m

  ig-creator:
    <<: *scraper-common
    command: ["tools/ig_creator_scrape.py"]
    container_name: ig-creator
    # One Camoufox browser per worker (IG_CREATOR_MAX_BROWSERS, default
    # 12) at roughly 250-300 MB each. The limit keeps an OOM inside this
    # container instead of starving every scraper on the host.
    mem_limit: 8g
    # Firefox content processes abort with "Page crashed" when /dev/shm
    # is the Docker default of 64m; 512m matches the browser's appetite.
    shm_size: 512m

  tw-creator:
    <<: *scraper-common
    command: ["tools/tw_creator_scrape.py"]
    container_name: tw-creator
    init: true
    # Camoufox browsers at roughly 250-300 MB each. The limit keeps an
    # OOM inside this container instead of starving the host.
    mem_limit: 8g
    # Firefox content processes abort with "Page crashed" when /dev/shm
    # is the Docker default of 64m; 512m matches the browser's appetite.
    shm_size: 512m

  of-creator:
    <<: *scraper-common
    command: ["tools/of_creator_scrape.py"]
    container_name: of-creator
    init: true
    # Camoufox browsers at roughly 250-300 MB each. The limit keeps an
    # OOM inside this container instead of starving the host.
    mem_limit: 8g
    # Firefox content processes abort with "Page crashed" when /dev/shm
    # is the Docker default of 64m; 512m matches the browser's appetite.
    shm_size: 512m

  scrape-upload:
    <<: *scraper-common
    command: ["tools/scrape_upload.py"]
    container_name: scrape-upload
