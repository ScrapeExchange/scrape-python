# Base docker-compose configuration for scrape-python scrapers.
#
# Usage with a per-host override:
#   docker compose -f docker-compose.yml \
#     -f docker-compose.<your-host>.yml up -d
#
# All services use the ghcr.io image.  Host-specific settings
# (NUM_PROCESSES, CONCURRENCY, volumes) go in the override file.

# Container-internal paths that override the relative paths
# from .env. Compose 'environment' takes precedence over
# 'env_file', so these win.
x-container-paths: &container-paths
  YOUTUBE_VIDEO_DATA_DIR: /data/videos
  YOUTUBE_CHANNEL_DATA_DIR: /data/channels
  DENO_PATH: /usr/local/deno/bin/deno

x-scraper-common: &scraper-common
  image: ghcr.io/scrapeexchange/scrape-python:latest
  env_file: .env
  restart: unless-stopped
  network_mode: host
  stop_grace_period: 60s

services:
  po-token-provider:
    image: brainicism/bgutil-ytdlp-pot-provider
    restart: unless-stopped
    network_mode: host
    init: true
    environment:
      PORT: 4416

  video:
    <<: *scraper-common
    command: ["tools/yt_video_scrape.py"]
    depends_on:
      - po-token-provider
    container_name: video
    environment:
      <<: *container-paths
      VIDEO_LOG_FILE: /var/log/scrape/scraper/yt_video.log

  video-upload:
    <<: *scraper-common
    command: ["tools/yt_video_upload.py"]
    container_name: video-upload
    environment:
      <<: *container-paths
      VIDEO_UPLOAD_LOG_FILE: /var/log/scrape/scraper/yt_video_upload.log

  channel:
    <<: *scraper-common
    command: ["tools/yt_channel_scrape.py"]
    container_name: channel
    environment:
      <<: *container-paths
      CHANNEL_LOG_FILE: /var/log/scrape/scraper/yt_channel.log

  channel-upload:
    <<: *scraper-common
    command: ["tools/yt_channel_upload.py"]
    container_name: channel-upload
    environment:
      <<: *container-paths
      CHANNEL_UPLOAD_LOG_FILE: /var/log/scrape/scraper/yt_channel_upload.log

  rss:
    <<: *scraper-common
    command: ["tools/yt_rss_scrape.py"]
    container_name: rss
    environment:
      <<: *container-paths
      RSS_LOG_FILE: /var/log/scrape/scraper/yt_rss.log
