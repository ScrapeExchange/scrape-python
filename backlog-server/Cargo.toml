[package]
name = "backlog_server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
crc32fast = "1.5.2"
libc = "0.2.191"
memmap2 = "0.9.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "backlog-server"
path = "src/main.rs"

[profile.release]
debug = 1
# A panicking queue owner must take the process down so the container
# restart policy recovers it, instead of a live PING over a dead queue.
panic = "abort"
